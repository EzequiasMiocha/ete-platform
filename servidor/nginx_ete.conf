# Nginx: recebe os visitantes no domínio, passa-os para a plataforma (porta 8501, só dentro do
# servidor) e serve a página leve do boletim. O HTTPS (cadeado) é acrescentado pelo certbot.
# Instalado por servidor/instalar.sh, com DOMINIO trocado pelo vosso domínio.
server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO www.DOMINIO;

    client_max_body_size 5m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # light page of the bulletin (for weak networks), and the fallback when the app is down
    location /leve/ {
        alias /opt/ete/docs/;
        index index.html;
        add_header Cache-Control "no-cache";
    }
    error_page 502 503 504 /leve/index.html;

    # the platform (Streamlit needs the websocket upgrade)
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}

# Aparência e servidor da aplicação ETE (as cores vêm de tema.py)
[theme]
base = "light"
primaryColor = "#1769AA"
backgroundColor = "#F4F7FA"
secondaryBackgroundColor = "#EAF2FA"
textColor = "#14212E"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

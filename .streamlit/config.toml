# Aparência e servidor da aplicação ETE (as cores e a tipografia vêm de tema.py; aqui ficam
# os valores de base, para os componentes do Streamlit nascerem já com a paleta do Copernicus)
[theme]
base = "light"
primaryColor = "#615C9F"
backgroundColor = "#F6F6F9"
secondaryBackgroundColor = "#EFEFF4"
textColor = "#212529"
linkColor = "#4E4A8C"
borderColor = "#E2E1EA"
baseRadius = "large"
font = "sans-serif"

[server]
headless = true
enableStaticServing = true     # logos in static/, at app/static/...

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = "none"
